# Production overlay: use this with an external env/secrets provider.
# No local emulator or Redis container is defined here; AWS managed services
# (RDS, ElastiCache, SQS and S3) are selected by the environment values.
services:
  api:
    environment:
      EDGENTRAG_ENVIRONMENT: production
      EDGENTRAG_AWS_ENDPOINT_URL: ""
    restart: unless-stopped

  ingestion-worker:
    environment:
      EDGENTRAG_ENVIRONMENT: production
      EDGENTRAG_AWS_ENDPOINT_URL: ""
    restart: unless-stopped

  chat-worker:
    environment:
      EDGENTRAG_ENVIRONMENT: production
      EDGENTRAG_AWS_ENDPOINT_URL: ""
    restart: unless-stopped
