services:
  floci:
    profiles: ["local"]
    image: floci/floci:latest
    environment:
      # Browser-facing URLs must resolve on the host. Application containers
      # use their explicit internal endpoint override below.
      FLOCI_BASE_URL: http://localhost:4566
      FLOCI_STORAGE_MODE: persistent
    ports:
      - "4566:4566"
    volumes:
      # Floci starts real service containers (for example Lambda/RDS) and
      # needs access to the host Docker daemon for those workflows and its UI.
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
  redis:
    profiles: ["local"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    profiles: ["local"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edgentrag
      POSTGRES_PASSWORD: edgentrag
      POSTGRES_DB: edgentrag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgentrag -d edgentrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      EDGENTRAG_AWS_ENDPOINT_URL: http://floci:4566
      EDGENTRAG_INGESTION_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-ingestion
      EDGENTRAG_CHAT_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-chat
      EDGENTRAG_STT_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-stt
      EDGENTRAG_EMBEDDING_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-embedding
      EDGENTRAG_REDIS_URL: redis://redis:6379/0
      EDGENTRAG_DATABASE_URL: postgresql+asyncpg://edgentrag:edgentrag@postgres:5432/edgentrag
      EDGENTRAG_ENVIRONMENT: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: ["uvicorn", "edgentrag.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ingestion-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.ingestion
    env_file:
      - ./backend/.env
    environment:
      EDGENTRAG_AWS_ENDPOINT_URL: http://floci:4566
      EDGENTRAG_INGESTION_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-ingestion
      EDGENTRAG_EMBEDDING_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-embedding
      EDGENTRAG_REDIS_URL: redis://redis:6379/0
      EDGENTRAG_ENVIRONMENT: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "edgentrag.ingestion.worker"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  chat-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.chat
    env_file:
      - ./backend/.env
    environment:
      EDGENTRAG_AWS_ENDPOINT_URL: http://floci:4566
      EDGENTRAG_CHAT_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-chat
      EDGENTRAG_REDIS_URL: redis://redis:6379/0
      EDGENTRAG_DATABASE_URL: postgresql+asyncpg://edgentrag:edgentrag@postgres:5432/edgentrag
      EDGENTRAG_ENVIRONMENT: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "edgentrag.chat.worker"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  stt-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.stt
    env_file:
      - ./backend/.env
    environment:
      EDGENTRAG_AWS_ENDPOINT_URL: http://floci:4566
      EDGENTRAG_STT_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-stt
      EDGENTRAG_REDIS_URL: redis://redis:6379/0
      EDGENTRAG_DATABASE_URL: postgresql+asyncpg://edgentrag:edgentrag@postgres:5432/edgentrag
      EDGENTRAG_ENVIRONMENT: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  embedding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.embedding
    env_file:
      - ./backend/.env
    environment:
      EDGENTRAG_AWS_ENDPOINT_URL: http://floci:4566
      EDGENTRAG_EMBEDDING_QUEUE_URL: http://floci:4566/000000000000/edgentrag-local-embedding
      EDGENTRAG_REDIS_URL: redis://redis:6379/0
      EDGENTRAG_DATABASE_URL: postgresql+asyncpg://edgentrag:edgentrag@postgres:5432/edgentrag
      EDGENTRAG_ENVIRONMENT: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  floci-data:
  redis-data:
  postgres-data:
