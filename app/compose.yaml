x-backend-env: &backend-env
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: ap-south-1
  EDGENTRAG_AWS_ENDPOINT_URL: http://host.docker.internal:4566
  EDGENTRAG_S3_BUCKET: edgentrag-local
  EDGENTRAG_INGESTION_QUEUE_URL: http://host.docker.internal:4566/000000000000/edgentrag-local-ingestion
  EDGENTRAG_CHAT_QUEUE_URL: http://host.docker.internal:4566/000000000000/edgentrag-local-chat
  EDGENTRAG_STT_QUEUE_URL: http://host.docker.internal:4566/000000000000/edgentrag-local-stt
  EDGENTRAG_EMBEDDING_QUEUE_URL: http://host.docker.internal:4566/000000000000/edgentrag-local-embedding
  EDGENTRAG_REDIS_URL: redis://redis:6379/0
  EDGENTRAG_DATABASE_URL: postgresql+asyncpg://edgentrag:edgentrag@postgres:5432/edgentrag
  EDGENTRAG_ENVIRONMENT: local

x-infra-depends: &infra-depends
  redis:
    condition: service_healthy
  postgres:
    condition: service_healthy

x-worker-depends: &worker-depends
  redis:
    condition: service_started
  postgres:
    condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edgentrag
      POSTGRES_PASSWORD: edgentrag
      POSTGRES_DB: edgentrag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgentrag -d edgentrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *infra-depends
    ports:
      - "8000:8000"
    command: ["uvicorn", "edgentrag.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  ingestion-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.ingestion
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "edgentrag.ingestion.worker"]
    depends_on:
      api:
        condition: service_healthy
      <<: *worker-depends

  chat-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.chat
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "edgentrag.chat.worker"]
    depends_on:
      api:
        condition: service_healthy
      <<: *worker-depends

  stt-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.stt
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *worker-depends

  embedding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.embedding
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *worker-depends

volumes:
  redis-data:
  postgres-data:
