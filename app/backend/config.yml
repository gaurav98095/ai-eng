# Committed, non-sensitive application defaults.
#
# Environment variables and backend/.env override these values. Keep tokens,
# passwords, private tunnel URLs, and deployment-specific service addresses in
# .env or the deployment secret manager.
environment: local
log_level: INFO
db_pool_size: 10
db_max_overflow: 5
redis_tls: false
history_turns: 8
aws_region: ap-south-1
aws_endpoint_url: http://localhost:4566
queue_wait_seconds: 20
queue_visibility_timeout_seconds: 900
queue_batch_size: 10
queue_max_receives: 5
sse_ticket_seconds: 60
upload_url_ttl_seconds: 900
max_upload_bytes: 20971520
max_text_extract_bytes: 20971520
# Override either switch in .env only when its selected private service URL is
# configured there too.
use_colab_for_embedding: true
use_colab_for_llm: true
use_colab_for_stt: true
generation_request_timeout_seconds: 300
stt_request_timeout_seconds: 600
max_audio_upload_bytes: 536870912
# Model-service defaults for one NVIDIA L4 (24 GB). Model changes require a
# model-service restart. Changing embedding_model_name also requires re-upload
# or re-ingestion, because old vectors intentionally do not mix with new ones.
#
# Embeddings (SentenceTransformers):
# - BAAI/bge-base-en-v1.5: recommended English-only quality/latency balance.
# - BAAI/bge-m3: multilingual, 8k-token inputs, 1024 dimensions; lower batch
#   size to 8-16 first and validate retrieval quality on your documents.
# - sentence-transformers/all-MiniLM-L6-v2: fastest 384-dimension baseline.
embedding_model_name: BAAI/bge-base-en-v1.5
embedding_device: auto
# Generation (the current Transformers host loads CUDA weights in FP16):
# - Qwen/Qwen2.5-7B-Instruct: recommended L4 default; use 4k input/8k window.
# - Qwen/Qwen2.5-3B-Instruct: faster/lower-cost fallback.
# - TinyLlama/TinyLlama-1.1B-Chat-v1.0: tiny teaching baseline.
# - 14B+ models need a quantized/vLLM serving adapter before use; the current
#   host intentionally does not silently quantize model weights.
generation_model_name: Qwen/Qwen2.5-7B-Instruct
generation_device: auto
generation_max_input_tokens: 4096
generation_context_window: 8192
# Bounded RAG context packing budget. Keep this below 16000 (the /generate
# wire-contract limit) and lower it if a selected tokenizer rejects prompts.
generation_prompt_max_chars: 12000
# Speech to text (faster-whisper/CTranslate2):
# - Systran/faster-whisper-large-v3: recommended multilingual L4 model.
# - Systran/faster-whisper-distil-large-v3: faster English-focused alternative.
# - Systran/faster-whisper-small.en: small English-only baseline.
stt_model_name: Systran/faster-whisper-large-v3
stt_device: auto
stt_compute_type: float16
stt_max_upload_bytes: 536870912
embedding_batch_size: 32
embedding_request_timeout_seconds: 180
search_max_chunks: 5000
