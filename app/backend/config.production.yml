# Committed, non-sensitive production defaults.
#
# The deployment must still inject database/Redis URLs, S3 and queue resource
# identifiers, Cognito identifiers, and all model-service URLs/tokens through
# its environment or secret manager.
environment: production
log_level: INFO
db_pool_size: 20
db_max_overflow: 10
redis_tls: true
history_turns: 8
aws_region: ap-south-1
aws_endpoint_url: null
queue_wait_seconds: 20
queue_visibility_timeout_seconds: 900
queue_batch_size: 10
queue_max_receives: 5
sse_ticket_seconds: 60
upload_url_ttl_seconds: 900
max_upload_bytes: 20971520
max_text_extract_bytes: 20971520
use_colab_for_embedding: true
use_colab_for_llm: true
use_colab_for_stt: true
generation_request_timeout_seconds: 300
stt_request_timeout_seconds: 600
max_audio_upload_bytes: 536870912
# One-L4 production profile. Restart model hosts after changes; embeddings need
# re-ingestion after a model change because vector dimensions/models differ.
# Alternatives: BAAI/bge-m3 (multilingual/long input; batch 8-16),
# sentence-transformers/all-MiniLM-L6-v2 (fast baseline), and
# BAAI/bge-base-en-v1.5 (English quality/latency balance, selected below).
embedding_model_name: BAAI/bge-base-en-v1.5
embedding_device: auto
# Qwen/Qwen2.5-7B-Instruct fits an L4 in the current FP16 Transformers host.
# Qwen/Qwen2.5-3B-Instruct is the lower-latency fallback. 14B+ requires a
# quantized/vLLM host; do not select it here until that host is deployed.
generation_model_name: Qwen/Qwen2.5-7B-Instruct
generation_device: auto
generation_max_input_tokens: 4096
generation_context_window: 8192
generation_prompt_max_chars: 12000
# Use Systran/faster-whisper-distil-large-v3 for faster English STT or
# Systran/faster-whisper-small.en for the smallest baseline.
stt_model_name: Systran/faster-whisper-large-v3
stt_device: auto
stt_compute_type: float16
stt_max_upload_bytes: 536870912
embedding_batch_size: 32
embedding_request_timeout_seconds: 180
search_max_chunks: 5000
