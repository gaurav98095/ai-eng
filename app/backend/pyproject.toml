[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgentrag-api"
version = "0.1.0"
description = "Backend API for EdgentRAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
generation = [
  "transformers>=4.45,<5",
  "torch>=2.6,<3",
  "sentencepiece>=0.2,<1",
]
embedding = [
  "sentence-transformers>=3,<6",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edgentrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
